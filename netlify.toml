[[redirects]]
from = "https://terrapreta.xyz/*"
to = "https://terrapreta.it/:splat"
status = 308
force = true

[[redirects]]
from = "https://www.terrapreta.xyz/*"
to = "https://terrapreta.it/:splat"
status = 308
force = true

[[redirects]]
from = "https://terrapreta.it/projects/osservatorio-la-goccia"
to = "https://terrapreta.it/projects/la-goccia-urban-forest"
status = 308
force = true

[build]
command = "bun install --frozen-lockfile && bun run build"
publish = ".next"

  [build.environment]
  BUN_VERSION = "1.3.3"
